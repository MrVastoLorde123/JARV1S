name: Deployment Closure CS8 Boundary Red-Team

on:
  push:
    branches:
      - 'feature/deployment-closure-cs*'
  pull_request:
    branches:
      - 'feature/deployment-closure-cs*'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-red-team:
    name: Boundary Red-Team + Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap database
        run: python -m src.database_bootstrap

      - name: Run CS8 core red-team
        run: python -m unittest src.core.tests.test_deployment_closure_cs8_boundary_red_team -v

      - name: Run CS8 model/provider red-team
        run: python -m unittest src.ai.tests.test_deployment_closure_cs8_model_boundary -v

      - name: Run authoritative core regression
        run: python -m unittest discover -s src/core/tests -p "test_*.py"

      - name: Run historical interface and AI closure gates
        run: |
          python -m unittest             src.interface.tests.test_http_command             src.interface.tests.test_http_capabilities             src.interface.tests.test_boundary             src.tools.tests.test_test_runner             src.ai.tests.test_local_model_policy             src.ai.tests.test_service_provider_model_observation
