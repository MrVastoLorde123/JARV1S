name: Deployment Closure CS10 Final Closure Audit

on:
  push:
    branches:
      - 'feature/deployment-closure-cs*'
  pull_request:
    branches:
      - 'feature/deployment-closure-cs*'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-closure-audit:
    name: Final Closure Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify closure artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/operations/CS1_FULL_REGRESSION_RECEIPT.md
          test -f docs/operations/CS2_VERIFICATION_RECEIPT.md
          test -f docs/operations/CS3_VERIFICATION_RECEIPT.md
          test -f docs/operations/CS4_VERIFICATION_RECEIPT.md
          test -f docs/operations/CS5_REPRODUCIBLE_DEPLOYMENT.md
          test -f docs/operations/CS6_VERIFICATION_CI_CLOSURE.md
          test -f docs/operations/CS7_DEPLOYMENT_ACCEPTANCE.md
          test -f docs/operations/CS8_VERIFICATION_RECEIPT.md
          test -f docs/operations/CS8_BOUNDARY_RED_TEAM.md
          test -f docs/operations/CS9_ARCHITECTURE_CLEANUP.md
          test -f docs/operations/CS9_VERIFICATION_RECEIPT.md
          test -f docs/operations/RUNNING_JARVIS_LOCAL.md
          test -f scripts/run_jarvis.ps1
          test -f src/run_local_jarvis.py
          test -f src/database_bootstrap.py
          test -f ui/package.json
          test -f ui/package-lock.json
          test ! -e .github/workflows/m28-verification.yml

      - name: Verify canonical architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'class PolicyGate' src/tools/gate.py
          grep -Fq 'authorization_recorder' src/tools/gate.py
          grep -Fq 'observe_provider_models("local")' src/run_local_jarvis.py
          grep -Fq 'PersistentMemoryRepository(database_path)' src/run_local_jarvis.py
          grep -Fq 'CodingExecutionLearningService(' src/run_local_jarvis.py
          grep -Fq 'JARVISRuntime.from_processor(' src/run_local_jarvis.py
          grep -Fq 'ToolPlanStepHandler.ACTION' src/core/jarvis.py
          grep -Fq 'class ExecutionObservation' src/core/execution_loop.py
          grep -Fq 'state: ExecutionState' src/core/execution_loop.py
          ! grep -Fq 'state: ExecutionState | None = None' src/core/execution_loop.py
          ! grep -Fq 'Preserve identity semantics for legacy dependency-injection contracts' src/interface/coding_execution_activity.py

      - name: Bootstrap database
        run: python -m src.database_bootstrap

      - name: Run CS8 adversarial boundary checks
        run: |
          python -m unittest src.core.tests.test_deployment_closure_cs8_boundary_red_team -v
          python -m unittest src.ai.tests.test_deployment_closure_cs8_model_boundary -v

      - name: Run historical closure gates
        run: |
          python -m unittest             src.interface.tests.test_http_command             src.interface.tests.test_http_capabilities             src.interface.tests.test_boundary             src.tools.tests.test_test_runner             src.ai.tests.test_local_model_policy             src.ai.tests.test_service_provider_model_observation

      - name: Run authoritative core regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s src/core/tests -p "test_*.py" 2>&1 | tee /tmp/jarvis-core-regression.txt
          grep -Eq 'Ran 3304 tests' /tmp/jarvis-core-regression.txt
          grep -Eq 'OK$' /tmp/jarvis-core-regression.txt

      - name: Verify UI reproducibility
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Verify repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short)"

      - name: Final audit result
        run: echo "JARVIS deployment closure audit PASSED."
